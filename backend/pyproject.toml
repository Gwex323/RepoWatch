[project]
name = "repowatch"
version = "0.1.0.dev0"
description = "RepoWatch 本地受控 Agent Harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "deepagents==0.7.32",
  "fastapi==0.162.0",
  "httpx>=0.28,<1",
  "langchain-openai==1.7.3",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "openai>=3.42,<4",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repowatch"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "repowatch/_migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
